name: Bundle Repository

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to bundle"
        required: true
        type: string
        default: "main"
      commit:
        description: "Commit SHA (leave empty to use branch HEAD)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit || inputs.branch }}

      - name: Create git bundle
        id: bundle
        run: |
          set -euo pipefail

          # Resolve to the actual commit being bundled
          TARGET_COMMIT="$(git rev-parse HEAD)"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          DATE="$(date +%Y%m%d)"
          BRANCH="${{ inputs.branch }}"

          BUNDLE_NAME="opensandbox-bundle-${DATE}-${SHORT_SHA}.bundle"
          TAG_NAME="bundle/${DATE}-${SHORT_SHA}"

          git bundle create "$BUNDLE_NAME" --all

          BUNDLE_SIZE="$(du -h "$BUNDLE_NAME" | cut -f1)"

          echo "bundle_name=${BUNDLE_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "target_commit=${TARGET_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

          echo "Branch: ${BRANCH}"
          echo "Commit: ${TARGET_COMMIT}"
          echo "Bundle: ${BUNDLE_NAME} (${BUNDLE_SIZE})"

      - name: Create release and upload bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE_NAME: ${{ steps.bundle.outputs.bundle_name }}
          TAG_NAME: ${{ steps.bundle.outputs.tag_name }}
          DATE: ${{ steps.bundle.outputs.date }}
          SHORT_SHA: ${{ steps.bundle.outputs.short_sha }}
          TARGET_COMMIT: ${{ steps.bundle.outputs.target_commit }}
          BRANCH: ${{ steps.bundle.outputs.branch }}
        run: |
          set -euo pipefail

          gh release create "$TAG_NAME" "$BUNDLE_NAME" \
            --title "Git Bundle ${DATE}-${SHORT_SHA}" \
            --notes "Full git bundle generated on ${DATE}.

          | Item | Value |
          |------|-------|
          | Branch | \`${BRANCH}\` |
          | Commit | \`${TARGET_COMMIT}\` |
          | Date | ${DATE} |
          | Bundle | \`${BUNDLE_NAME}\` |

          **Usage:**
          ```bash
          git clone ${BUNDLE_NAME} /path/to/repo
          cd /path/to/repo
          git remote add origin <original-url>
          git fetch origin
          ```"
